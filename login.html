<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Stackly</title>
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body"> 

  <!-- Preloader Screen with Logo -->
  <div id="preloader">
    <div class="preloader-content">
      <img src="home.img/01-header-logo.webp" alt="Stackly Logo" class="preloader-logo">
      <div class="preloader-spinner"></div>
      <div class="preloader-bar-wrapper">
        <div class="preloader-bar"></div>
      </div>
    </div>
  </div>

  <div class="auth-page">
    
    <!-- Left Column: Graphic Side -->
    <div class="auth-left">
      <div class="auth-dots-bg"></div>
      <div class="auth-left-content">
        <span class="auth-tag">WELCOME BACK</span>
        <h1 class="auth-heading">Log in to your <span class="highlight-blue">Stackly</span> account</h1>
        <p class="auth-subtext">
          Access your dashboard, manage your projects and keep everything in one place.
        </p>
        <div class="auth-illustration">
          <img src="home.img/image 17.webp" alt="Log in to Stackly Illustration">
        </div>
      </div>
    </div>

    <!-- Right Column: Form Side -->
    <div class="auth-right">
      <a href="index.html" class="auth-close-btn" aria-label="Close page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </a>
      <div class="auth-form-card">
        <h2 class="auth-form-title">Welcome Back!</h2>
        <p class="auth-form-subtitle">Please enter your details to log in</p>

        <form class="auth-form">
          <!-- Role Select -->
          <div class="auth-field-group">
            <label class="auth-label">Select Role</label>
            <div class="auth-input-wrapper">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              </span>
              <select class="auth-select" required>
                <option value="" disabled selected>Select your role</option>
                <option value="admin">Administrator</option>
                <option value="client">Client / User</option>
                <option value="consultant">Consultant</option>
              </select>
            </div>
          </div>

          <!-- Email Field -->
          <div class="auth-field-group">
            <label class="auth-label">Email Address</label>
            <div class="auth-input-wrapper">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </span>
              <input type="email" placeholder="Enter your email" class="auth-input" required>
            </div>
          </div>

          <!-- Password Field -->
          <div class="auth-field-group">
            <label class="auth-label">Password</label>
            <div class="auth-input-wrapper">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input type="password" placeholder="Enter your password" class="auth-input" required>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <!-- Meta Row: Remember & Forgot -->
          <div class="auth-meta-row">
            <label class="checkbox-label">
              <input type="checkbox">
              <span>Remember me</span>
            </label>
            <a href="404.html" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-auth-primary">Log In</button>

          <!-- Divider -->
          <div class="auth-divider">
            <span>or continue with</span>
          </div>

          <!-- Social Login Options -->
          <div class="auth-social-grid">
            <a href="404.html" class="btn-social">
              <svg viewBox="0 0 24 24" class="social-svg-icon"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
              <span>Google</span>
            </a>
            <a href="404.html" class="btn-social">
              <svg viewBox="0 0 24 24" class="social-svg-icon" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
              <span>Facebook</span>
            </a>
          </div>

          <!-- Bottom Switch Link -->
          <p class="auth-switch-text">
            Don't have an account? <a href="signup.html" class="auth-switch-link">Sign Up</a>
          </p>

        </form>
      </div>
    </div>

  </div>

  <script src="main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('.auth-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const roleSelect = form.querySelector('.auth-select');
          const role = roleSelect ? roleSelect.value : 'client';

          let targetDashboard = 'client-dashboard.html';
          if (role === 'admin') targetDashboard = 'admin-dashboard.html';
          else if (role === 'consultant') targetDashboard = 'consultant-dashboard.html';

          // Show preloader transition then navigate
          const preloader = document.getElementById('preloader');
          if (preloader) {
            preloader.style.display = 'flex';
            preloader.classList.remove('preloader-hidden');
          }
          setTimeout(() => {
            window.location.href = targetDashboard;
          }, 1000);
        });
      }
    });
  </script>
</body>
</html>
